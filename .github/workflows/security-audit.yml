name: Enterprise Security Audit
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: [self-hosted, blackroad, gematria]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan for hardcoded secrets
        run: |
          echo "=== Secret Scan ==="
          FOUND=0
          for pattern in 'AKIA[0-9A-Z]{16}' 'ghp_[a-zA-Z0-9]{36}' 'gho_[a-zA-Z0-9]{36}' 'sk-[a-zA-Z0-9]{48}' 'sk_live_[a-zA-Z0-9]+'; do
            if grep -rn --include='*.py' --include='*.js' --include='*.ts' --include='*.sh' --include='*.yaml' --include='*.yml' -E "$pattern" . 2>/dev/null | grep -v node_modules | grep -v .git | head -3; then
              FOUND=$((FOUND + 1))
            fi
          done
          if [ $FOUND -gt 0 ]; then
            echo "::error::Potential secrets found!"
            exit 1
          fi
          echo "Clean — no secrets detected"

      - name: Check for dangerous permissions
        run: |
          echo "=== Permission Audit ==="
          find . -name '*.yml' -path '*/.github/workflows/*' -exec grep -l 'permissions:' {} \; 2>/dev/null | while read f; do
            if grep -q 'contents: write' "$f" && grep -q 'pull_request' "$f"; then
              echo "::warning file=$f::Workflow has write permissions on pull_request trigger"
            fi
          done
          echo "Done"
