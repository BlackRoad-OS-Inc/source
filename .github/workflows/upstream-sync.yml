name: Upstream Sync
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Configure git author
        run: |
          git config user.name "blackroad-source[bot]"
          git config user.email "source@blackroad.io"
      - name: Sync upstream repos
        run: bash scripts/upstream-sync.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
